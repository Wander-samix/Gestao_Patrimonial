{% extends "core/base.html" %}
{% block title %}Novo Pedido{% endblock %}

{% block content %}
<div class="container mt-5 mb-5">
  <h2 class="mb-4">Novo Pedido</h2>
  <div class="card shadow-sm">
    <div class="card-body">
      <form method="post" action="{% url 'novo_pedido' %}">
        {% csrf_token %}

        <div id="itensPedido">
          <div class="row g-3 border-bottom pb-3 mb-3 item-linha">
            <div class="col-md-4">
              <label class="form-label">Área</label>
              <select name="area_id" class="form-select area-select" onchange="carregarProdutos(this)">
                <option value="">Selecione Área</option>
                {% for a in areas %}
                  <option value="{{ a.id }}">{{ a.nome }}</option>
                {% endfor %}
              </select>
            </div>

            <div class="col-md-4">
              <label class="form-label">Produto</label>
              <select name="produto_id" class="form-select produto-select" onchange="atualizarInfo(this)" disabled>
                <option value="">–</option>
              </select>
              <input type="hidden" name="codigo_barras" class="codigo-barras-input">
            </div>

            <div class="col-md-4">
              <label class="form-label">Estoque Disponível</label>
              <input type="text" class="form-control total-estoque" value="–" readonly>
            </div>

            <div class="col-md-4">
              <label class="form-label">Validade</label>
              <input type="date" name="validade" class="form-control validade-input" readonly>
            </div>

            <div class="col-md-4">
              <label class="form-label">Quantidade</label>
              <input type="number" name="quantidade" class="form-control quantidade-input" value="1" min="1" disabled>
            </div>

            <div class="col-md-4">
              <label class="form-label">Data Necessária</label>
              <input type="date" name="data_necessaria" class="form-control" required>
            </div>

            <div class="col-md-10">
              <label class="form-label">Observação</label>
              <input type="text" name="obs_item" class="form-control" maxlength="255" placeholder="—">
            </div>

            <div class="col-md-2 d-flex align-items-end justify-content-end">
              <button type="button" class="btn btn-outline-danger btn-sm" onclick="removerItem(this)">
                🗑 Remover
              </button>
            </div>
          </div>
        </div>

        <div class="mb-3 text-end">
          <a href="#" onclick="addRow(); return false;">+ Mais Itens</a>
        </div>

        <div class="d-flex justify-content-end gap-2">
          <a href="{% url 'lista_pedidos' %}" class="btn btn-outline-secondary">
            <i class="bi bi-x-circle me-1"></i>Voltar
          </a>
          <button type="submit" class="btn btn-success">
            <i class="bi bi-save me-1"></i>Salvar Pedido
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const ajaxUrl = "{% url 'produtos_por_area' 0 %}";

function addRow() {
  const item = document.querySelector('.item-linha');
  const nova = item.cloneNode(true);
  nova.querySelectorAll('input').forEach(i => { i.value = ''; });
  nova.querySelector('.produto-select').innerHTML = '<option value="">–</option>';
  nova.querySelector('.produto-select').disabled = true;
  nova.querySelector('.codigo-barras-input').value = '';
  nova.querySelector('.total-estoque').value = '–';
  nova.querySelector('.quantidade-input').disabled = true;
  document.getElementById('itensPedido').appendChild(nova);
}

function removerItem(botao) {
  const linhas = document.querySelectorAll('.item-linha');
  if (linhas.length > 1) {
    botao.closest('.item-linha').remove();
  } else {
    alert("É necessário pelo menos um item no pedido.");
  }
}

function carregarProdutos(select) {
  const areaId = select.value;
  const item = select.closest('.item-linha');
  const prodSel = item.querySelector('.produto-select');
  const estoque = item.querySelector('.total-estoque');
  const validade = item.querySelector('.validade-input');
  const codigo = item.querySelector('.codigo-barras-input');
  const qtd = item.querySelector('.quantidade-input');

  prodSel.innerHTML = '<option>Carregando…</option>';
  prodSel.disabled = true;
  estoque.value = '–';
  validade.value = '';
  codigo.value = '';
  qtd.disabled = true;

  if (!areaId) {
    prodSel.innerHTML = '<option value="">–</option>';
    return;
  }

  fetch(ajaxUrl.replace('/0/', `/${areaId}/`))
    .then(r => r.json())
    .then(lista => {
      prodSel.innerHTML = '<option value="">Selecione Produto</option>';
      lista.forEach(p => {
        const opt = new Option(p.descricao, p.id);
        opt.dataset.estoque = p.disponivel || 0;
        opt.dataset.validade = p.validade;
        opt.dataset.codigo = p.codigo_barras;
        prodSel.add(opt);
      });
      prodSel.disabled = false;
    })
    .catch(() => prodSel.innerHTML = '<option value="">Erro</option>');
}

function atualizarInfo(select) {
  const item = select.closest('.item-linha');
  const area = item.querySelector('.area-select').value;
  const id = select.value;
  const opt = select.selectedOptions[0] || {};
  const estoqueInput = item.querySelector('.total-estoque');
  const validade = item.querySelector('.validade-input');
  const codigo = item.querySelector('.codigo-barras-input');
  const qtd = item.querySelector('.quantidade-input');

  let baseEstoque = parseInt(opt.dataset.estoque) || 0;
  let validadeVal = opt.dataset.validade || '';
  let codigoVal = opt.dataset.codigo || '';

  // Checar duplicatas
  document.querySelectorAll('.item-linha').forEach(r => {
    if (r === item) return;
    if (r.querySelector('.area-select').value === area &&
        r.querySelector('.produto-select').value === id) {
      alert('Produto já indicado. Ajuste a quantidade na linha existente.');
      r.classList.add('blink');
      setTimeout(() => r.classList.remove('blink'), 3000);
      select.value = '';
    }
  });

  // Atualizar info
  estoqueInput.value = baseEstoque;
  validade.value = validadeVal;
  codigo.value = codigoVal;
  qtd.disabled = !id;
  qtd.max = baseEstoque;
  if (qtd.value > baseEstoque) qtd.value = baseEstoque;
}

document.addEventListener('input', function(e) {
  if (e.target.classList.contains('quantidade-input')) {
    const row = e.target.closest('.item-linha');
    const estoque = parseInt(row.querySelector('.total-estoque').value || 0);
    const quantidade = parseInt(e.target.value || 0);
    if (quantidade > estoque) e.target.classList.add('is-invalid');
    else e.target.classList.remove('is-invalid');
  }
});

document.querySelector('form').addEventListener('submit', function(e) {
  const invalids = document.querySelectorAll('.quantidade-input.is-invalid');
  if (invalids.length) {
    e.preventDefault();
    alert('Algumas quantidades excedem o estoque disponível.');
  }
});
</script>
{% endblock %}
